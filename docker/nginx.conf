worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen 8081;
        server_name _;
        root /app/web;
        index index.html;

        # Proxied straight to the API process running in this same container
        # (see docker/s6-overlay/s6-rc.d/api) — not through the API's own
        # separately-exposed port (8080), which stays available for direct,
        # out-of-band access (MCP server, webhooks).
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Avatar images (LocalAvatarStorage) are served outside the /api
        # prefix by the API (app.UseStaticFiles()), so they need their own
        # proxy location — see resolveAssetUrl() in ApiClient.ts.
        location /avatars/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
